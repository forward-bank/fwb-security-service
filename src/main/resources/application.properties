# ─── Server ────────────────────────────────────────────────────────────────
server.port=8085

# ─── IBM MQ ────────────────────────────────────────────────────────────────
mq.host=localhost
mq.port=1414
mq.channel=SYSTEM.DEF.SVRCONN
mq.queueManager=MY.TEST.QMNGR

# ─── AWS S3 / LocalStack ────────────────────────────────────────────────────
# true  → S3Client points at LocalStack (local dev / CI)
# false → S3Client uses DefaultCredentialsProvider (production)
aws.localstack.enabled=true
aws.localstack.endpoint=http://localhost:4566
aws.region=us-east-1
aws.accessKeyId=test
aws.secretAccessKey=test

# S3 bucket that holds both payment files and PGP key material.
# paymentFilePath and key paths in requests are bucket-relative keys (no s3:// prefix).
aws.s3.bucket=fwb-payments-dev

# ─── Database (Customer Key Config) ────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/fwb_security_db
spring.datasource.username=fwb_user
spring.datasource.password=fwb_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
